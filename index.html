<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0807">
<title>FC Kapellerfeld · Shop (Demo)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,400,0..1&display=block" rel="stylesheet">
<style>
:root { --club: #c8102e; --club2: #141414; --bg: #0a0807; --ink: #f4efe9; --mut: #a99d92; --line: rgba(255, 240, 225, .14); --card: rgba(24, 19, 16, .86); --field: #1d1714; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Barlow, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.ms { font-family: 'Material Symbols Rounded'; font-size: 22px; line-height: 1; width: 1em; height: 1em; overflow: hidden; white-space: nowrap; font-variation-settings: 'FILL' 0; vertical-align: middle; display: inline-block; }
.ms.sm { font-size: 17px; }
.muted { color: var(--mut); } .small { font-size: 13px; line-height: 1.45; }
#stage { position: fixed; inset: 0; }
#stage canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
#stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 85% 75% at 50% 45%, transparent 55%, rgba(0, 0, 0, .55)); }
/* Kopf und Fuß */
#top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top)) 18px 14px; z-index: 5; pointer-events: none; background: linear-gradient(rgba(10, 8, 7, .75), transparent); }
#top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand > div { min-width: 0; }
.brand b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
.brand span { font-size: 13px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.crest { width: 44px; height: 44px; object-fit: contain; flex: none; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .5)); }
.crest.sm { width: 36px; height: 36px; } .crest.lg { width: 96px; height: 96px; }
.topbtns { display: flex; gap: 8px; flex: none; }
.tabs { position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 24px; border: 1px solid var(--line); background: rgba(22, 17, 14, .72); backdrop-filter: blur(10px); }
.tab { height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: transparent; font-weight: 600; font-size: 14px; color: var(--mut); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--ink); color: #120e0c; }
.tab .lock { font-size: 14px; opacity: .7; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--c); }
.swatch.on { outline: 2px solid var(--ink); outline-offset: 2px; }
.upload { flex-direction: row; align-items: center; gap: 10px; padding: 12px 14px; border: 1px dashed rgba(255, 240, 225, .35); border-radius: 12px; background: var(--field); font-weight: 500; cursor: pointer; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload:focus-within { outline: 2px solid var(--club); }
@media (max-width: 1100px) { .tabs { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 54px); } #detail, #sheet { top: 124px; } }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 16px; border-radius: 21px; border: 1px solid var(--line); background: rgba(22, 17, 14, .7); backdrop-filter: blur(10px); font-weight: 600; font-size: 15px; }
.pill:hover { border-color: rgba(255, 240, 225, .35); }
.pill.icon, .pill.cart { padding: 0; width: 42px; justify-content: center; position: relative; }
.pill.cart.bump { animation: bump .6s cubic-bezier(.3, 1.6, .5, 1); } @keyframes bump { 35% { transform: scale(1.3) rotate(-8deg); } }
.pill.cart i { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--club); color: #fff; font-style: normal; font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
#bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; padding: 18px 18px max(18px, env(safe-area-inset-bottom)); pointer-events: none; background: linear-gradient(transparent, rgba(10, 8, 7, .8)); }
#bottom > * { pointer-events: auto; }
.fuer { justify-self: start; display: flex; align-items: center; gap: 8px; text-align: left; max-width: 420px; padding: 11px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); backdrop-filter: blur(10px); font-size: 15px; line-height: 1.3; }
.fuer.leer { border-color: var(--club); box-shadow: 0 0 0 3px color-mix(in srgb, var(--club) 25%, transparent); }
.fuer .ms { color: var(--club); }
.hint { margin: 0 0 6px; font-size: 13px; color: var(--mut); text-align: center; white-space: nowrap; }
.arrows { justify-self: end; display: flex; gap: 8px; }
.rnd { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
body.detail-open .hint, body.detail-open .arrows { opacity: 0; pointer-events: none; }
/* Detail und Dialoge */
#detail, #sheet { position: fixed; z-index: 6; top: 76px; right: 18px; bottom: 18px; width: min(410px, calc(100vw - 36px)); transform: translateX(calc(100% + 40px)); transition: transform .55s cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
#detail.open, #sheet.open { transform: none; pointer-events: auto; }
#sheet { z-index: 7; }
.sheet-in { position: relative; height: 100%; overflow: auto; padding: 26px 24px 24px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(16px); box-shadow: 0 30px 80px rgba(0, 0, 0, .55); display: flex; flex-direction: column; gap: 14px; }
.sheet-in h2 { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; line-height: 1.02; text-transform: uppercase; letter-spacing: .01em; padding-right: 40px; }
.sheet-in p { margin: 0; line-height: 1.5; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: color-mix(in srgb, var(--club) 70%, #fff); padding-right: 48px; }
.price { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; }
.x { position: absolute; z-index: 3; top: 18px; right: 18px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
input, select { height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); font-size: 16px; font-weight: 500; width: 100%; }
input[type=color] { padding: 4px; }
input:focus, select:focus { outline: 2px solid var(--club); outline-offset: 1px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; } .row2 .nr { max-width: 110px; } .row2:has(.nr) { grid-template-columns: 1fr 110px; }
.lab { font-size: 14px; font-weight: 600; margin: 4px 0 -4px !important; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 54px; height: 42px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); font-weight: 600; }
.chip.on { background: var(--ink); color: #120e0c; border-color: var(--ink); }
.seiten { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ghost { height: 44px; border-radius: 12px; border: 1px solid var(--line); background: transparent; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.primary { min-height: 54px; border: 0; border-radius: 14px; background: var(--club); color: #fff; font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; box-shadow: 0 10px 30px color-mix(in srgb, var(--club) 35%, transparent); }
.primary:hover { filter: brightness(1.1); }
.radio { flex-direction: row; align-items: center; gap: 10px; font-weight: 500; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); }
.radio input { width: 20px; height: 20px; accent-color: var(--club); }
.lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lines li { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.lines li span { display: block; font-size: 13px; color: var(--mut); }
.qty { display: flex; align-items: center; gap: 8px; } .qty button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent; font-size: 18px; }
.total { display: flex; justify-content: space-between; align-items: baseline; font-size: 17px; padding-top: 4px; } .total b { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--club) 14%, transparent); border: 1px solid color-mix(in srgb, var(--club) 40%, transparent); font-size: 14px; }
.err { color: #ff8a80; font-weight: 600; font-size: 14px; } .err:empty { display: none; }
.bank { border-radius: 16px; background: #f7f3ee; color: #17110d; padding: 16px; display: flex; flex-direction: column; gap: 2px; }
.bankhead { display: flex; gap: 12px; align-items: center; padding-bottom: 10px; margin-bottom: 4px; border-bottom: 1px solid #e3dad0; }
.bankhead b { display: block; font-size: 16px; } .bankhead span { font-size: 13px; color: #6b5f55; }
.bz { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #eee5db; }
.bz span { display: block; font-size: 12px; color: #6b5f55; } .bz b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; word-break: break-word; }
.copy { width: 36px; height: 36px; border-radius: 10px; border: 1px solid #ddd2c6; background: #fff; display: grid; place-items: center; color: #17110d; }
.qrwrap { display: grid; grid-template-columns: 132px 1fr; gap: 14px; align-items: center; padding-top: 12px; }
.qr { width: 132px; height: 132px; background: #fff; border-radius: 8px; } .qr svg { width: 100%; height: 100%; display: block; }
.shopify { display: flex; gap: 12px; padding: 16px; border-radius: 14px; background: var(--field); border: 1px solid var(--line); }
.demo { font-style: normal; font-weight: 700; color: #120e0c; background: #f4efe9; border-radius: 6px; padding: 0 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
code { font-size: 13px; background: var(--field); padding: 1px 5px; border-radius: 5px; }
#toast { position: fixed; z-index: 9; left: 50%; bottom: 96px; transform: translate(-50%, 20px); opacity: 0; transition: .35s; padding: 12px 18px; border-radius: 14px; background: var(--ink); color: #120e0c; font-weight: 600; pointer-events: none; max-width: calc(100vw - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.vereine-link { position: fixed; z-index: 4; right: 18px; bottom: 76px; font-size: 12px; color: var(--mut); background: none; border: 0; opacity: .55; }
.vereine-link:hover { opacity: 1; }
body.werkstatt-seite .vereine-link { display: none; }
a.tab { text-decoration: none; }
.tab.werkstatt-link { margin-left: 6px; border: 1px solid rgba(224, 160, 58, .55); color: #f0c27a; }
.tab.werkstatt-link:hover { background: rgba(224, 160, 58, .14); color: #ffd79a; }
.tab.werkstatt-link .ms:last-child { font-size: 14px; opacity: .8; }
.tabs.werk .tab.on { background: #e0a03a; color: #16120f; }
/* Ladebildschirm */
#loader { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: grid; place-items: center; text-align: center; transition: opacity .9s ease, visibility .9s; }
body.drin #loader { opacity: 0; visibility: hidden; }
.lbox { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; }
.lname { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: .3em; text-transform: uppercase; color: var(--mut); }
.count { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: clamp(90px, 22vw, 190px); line-height: .9; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.lsub { color: var(--mut); letter-spacing: .08em; }
.enter { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; opacity: 0; transform: translateY(10px); transition: .6s; pointer-events: none; }
#loader.ready .enter { opacity: 1; transform: none; pointer-events: auto; }
.enter button { height: 52px; padding: 0 22px; border-radius: 26px; border: 1px solid var(--line); background: transparent; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.enter button.main { background: var(--ink); color: #120e0c; border-color: var(--ink); }
.nogl { position: absolute; inset: 90px 18px 110px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; align-content: start; }
.nogl-card { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }
@media (max-width: 760px) {
  .pill .lbl { display: none; } .pill { width: 42px; padding: 0; justify-content: center; }
  .brand b { font-size: 18px; } .brand span { font-size: 12px; } .crest { width: 38px; height: 38px; } .topbtns { gap: 6px; }
  #bottom { grid-template-columns: 1fr auto; } .hint { display: none; }
  .fuer { font-size: 14px; }
  .tabs { left: 12px; right: 12px; transform: none; justify-content: space-between; } .tab { flex: 1; justify-content: center; padding: 0 8px; }
  #detail, #sheet { top: auto; left: 0; right: 0; bottom: 0; width: 100%; height: min(52svh, 540px); transform: translateY(105%); }
  #sheet { height: min(88svh, 760px); }
  .sheet-in { border-radius: 22px 22px 0 0; padding: 22px 18px max(20px, env(safe-area-inset-bottom)); }
  .sheet-in h2 { font-size: 28px; }
  .qrwrap { grid-template-columns: 112px 1fr; } .qr { width: 112px; height: 112px; }
  .vereine-link { bottom: 84px; }
  body.detail-open #bottom { opacity: 0; pointer-events: none; }
  body.detail-open .tabs, body.sheet-open .tabs { opacity: 0; pointer-events: none; }
  .tab.werkstatt-link { margin-left: 0; } .tab.werkstatt-link .otb, .tab.werkstatt-link .ms:last-child { display: none; }
}
@media (prefers-reduced-motion: reduce) { #detail, #sheet, #loader, .enter, #toast { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<header id="top"></header>
<footer id="bottom"></footer>
<aside id="detail" aria-live="polite"></aside>
<div id="sheet" role="dialog" aria-modal="true"></div>
<button class="vereine-link" data-a="vereine">Vereine (OTB)</button>
<div id="toast" role="status"></div>
<div id="loader">
  <div class="lbox">
    <div class="lcrest"></div>
    <div class="lname"></div>
    <div class="count">000</div>
    <div class="lsub">Die Kabine wird aufgesperrt</div>
    <div class="enter"><button class="main" id="enterSound"><span class="ms">volume_up</span> Mit Ton eintreten</button><button id="enterMute"><span class="ms">volume_off</span> Ohne Ton</button></div>
    <div class="small muted">Am besten mit Ton</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

      <p class="small muted">${esc(VC.name)} · ${esc(VC.adresse)}${VC.zvr ? ` · ZVR ${esc(VC.zvr)}` : ''}<br>Fragen zur Zahlung: <a href="mailto:${esc(VC.zahlung.fragen)}">${esc(VC.zahlung.fragen)}</a></p>
      <button class="primary" data-a="zu">Alles klar</button>`;
  }
  if (sh === 'vereine') return vereineHTML();
  return '';
}
function vereineHTML() {
  const n = S.neu || { name: '', beiname: '', kuerzel: '', farbe: '#1d4ed8', farbe2: '#111827', logo: '', teams: 'U8, U10, U12, Kampfmannschaft', art: 'verein', empfaenger: '', iban: '', bank: '', fragen: '' };
  return `<button class="x" data-a="zu" aria-label="Schließen"><span class="ms">close</span></button><p class="eyebrow">Nur für OTB</p><h2>Vereine</h2>
    <p class="lab">Shop ansehen als</p><div class="chips">${Object.entries(VEREINE).map(([k, v]) => `<button class="chip ${k === S.verein ? 'on' : ''}" data-a="verein" data-k="${k}">${esc(v.name)}</button>`).join('')}</div>
    <p class="lab">Neuen Verein anlegen</p>
    <div class="row2"><label>Vereinsname<input id="nName" value="${esc(n.name)}" placeholder="SC Beispielstadt"></label><label class="nr">Kürzel<input id="nKurz" maxlength="4" value="${esc(n.kuerzel)}" placeholder="SCB"></label></div>
    <label>Beiname / Motto<input id="nBei" value="${esc(n.beiname)}" placeholder="Die Adler"></label>
    <div class="row2"><label>Hauptfarbe<input id="nF1" type="color" value="${esc(n.farbe)}"></label><label>Zweitfarbe<input id="nF2" type="color" value="${esc(n.farbe2)}"></label></div>
    <label>Logo-Adresse <span class="muted">(PNG mit transparentem Hintergrund)</span><input id="nLogo" value="${esc(n.logo)}" placeholder="https://…/logo.png"></label>
    <label>Mannschaften <span class="muted">(mit Komma getrennt)</span><input id="nTeams" value="${esc(n.teams)}"></label>
    <p class="lab">Zahlung</p>
    <label class="radio"><input type="radio" name="nArt" value="verein" ${n.art === 'verein' ? 'checked' : ''}> Überweisung direkt an den Verein</label>
    <label class="radio"><input type="radio" name="nArt" value="otb" ${n.art === 'otb' ? 'checked' : ''}> Über OTB (Shopify-Kasse, Verein bekommt Provision)</label>
    <div class="row2"><label>Kontoinhaber<input id="nEmpf" value="${esc(n.empfaenger)}"></label><label>IBAN<input id="nIban" value="${esc(n.iban)}"></label></div>
    <div class="row2"><label>Bank<input id="nBank" value="${esc(n.bank)}"></label><label>E-Mail für Zahlungsfragen<input id="nMail" value="${esc(n.fragen)}"></label></div>
    <p class="err" id="nErr" role="alert"></p>
    <div class="row2"><button class="primary" data-a="neuVorschau">Vorschau öffnen</button><button class="ghost" data-a="neuKopieren"><span class="ms sm">content_copy</span> Konfiguration kopieren</button></div>
    <p class="small muted">Die kopierte Konfiguration kommt als neuer Block in <code>VEREINE</code> – danach ist der Shop unter <code>?verein=kuerzel</code> erreichbar.</p>`;
}
function zeigeSheet() {
  const el = $('#sheet'); const html = sheetHTML();
  el.innerHTML = html ? `<div class="sheet-in">${html}</div>` : ''; el.classList.toggle('open', !!html); document.body.classList.toggle('sheet-open', !!html);
  if (S.sheet === 'danke' && VC.zahlung.art === 'verein') zeichneQR(S.bestellung);
  const first = el.querySelector('input,select'); if (first && S.sheet !== 'danke') setTimeout(() => first.focus({ preventScroll: true }), 50);
}
function zeigeDetail() {
  const el = $('#detail'); el.innerHTML = S.sel ? `<div class="sheet-in">${detailHTML(S.sel)}</div>` : ''; el.classList.toggle('open', !!S.sel); document.body.classList.toggle('detail-open', !!S.sel);
  if (S.sel) bindLive();
}
function render() { kopf(); fuss(); zeigeSheet(); zeigeDetail(); }

// EPC-QR („Zahlen mit Code“): Empfänger, IBAN, Betrag, Zweck
function epc(b) { const z = VC.zahlung; return ['BCD', '002', '1', 'SCT', z.bic || '', z.empfaenger.slice(0, 70), z.iban, 'EUR' + b.summe.toFixed(2), '', '', b.zweck.slice(0, 140), ''].join('\n'); }
function zeichneQR(b) {
  const el = $('#qr'); if (!el) return;
  if (typeof qrcode !== 'function') { el.innerHTML = '<p class="small muted">QR-Code nicht verfügbar – bitte die Daten oben verwenden.</p>'; return; }
  const q = qrcode(0, 'M'); q.stringToBytes = qrcode.stringToBytesFuncs ? qrcode.stringToBytesFuncs['UTF-8'] : q.stringToBytes; q.addData(epc(b)); q.make();
  el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
}

// Live-Vorschau: Eingaben färben sofort das 3D-Teil
const persForm = () => { const sp = persAktiv(); return { ...sp, name: S.form.name ?? sp.name, nummer: S.form.nummer ?? sp.nummer, fanNr: S.form.fanNr, text: S.form.text, farbe: S.form.farbe, motiv: S.form.motiv }; };
function live() { const i = sortiment().indexOf(S.sel); if (i >= 0 && GL.cur?.pickables) { GL.cur.pickables[i].userData.refresh(descFor(S.sel, persForm())); GL.cur.pulse?.(); } }
function bindLive() {
  const upd = () => {
    const n = $('#fName'), r = $('#fNr'), fn = $('#fFanNr'), tx = $('#fText');
    if (n) S.form.name = n.value; if (r) S.form.nummer = r.value.replace(/\D/g, ''); if (fn) S.form.fanNr = fn.value.replace(/\D/g, ''); if (tx) S.form.text = tx.value;
    live();
  };
  ['#fName', '#fNr', '#fFanNr', '#fText'].forEach((s) => $(s)?.addEventListener('input', upd));
  $('#fMotiv')?.addEventListener('change', (e) => { // eigenes Motiv: Datei bleibt im Browser, wird live aufs Teil gelegt
    const file = e.target.files?.[0]; if (!file) return; if (file.size > 15e6) return toast('Datei ist zu groß (max. 15 MB)');
    const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = () => { S.form.motiv = im; S.form.motivName = file.name; if (S.form.text === undefined) S.form.text = ''; live(); zeigeDetail(); toast('Motiv liegt drauf'); }; im.src = rd.result; }; rd.readAsDataURL(file);
  });
}
const uebergabe = () => (S.shop === 'werkstatt' ? WERKSTATT.uebergabe : S.shop === 'fan' ? CLUB.fanUebergabe || CLUB.uebergabe : CLUB.uebergabe);

// ===================== Aktionen =====================
function toast(t) { const b = $('#toast'); b.textContent = t; b.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => b.classList.remove('on'), 2200); }
const AKT = {
  ton() { S.ton = !S.ton; tonAn(S.ton); kopf(); },
  konto() { AKT.schliessen(true); S.sheet = 'konto'; zeigeSheet(); },
  korb() { AKT.schliessen(true); S.sheet = 'korb'; zeigeSheet(); },
  spieler() { AKT.schliessen(true); S.sheet = 'spieler'; zeigeSheet(); },
  shop(el) { const s = el.dataset.s; if (s === 'werkstatt') { location.href = werkstattUrl(); return; } if (s === S.shop) return; if (s === 'team' && !zugang()) { AKT.schliessen(true); S.sheet = 'code'; return zeigeSheet(); } wechsle(s); },
  codeOk() { const c = ($('#cCode').value || '').trim().toUpperCase(); if (c !== String(CLUB.code).toUpperCase()) { $('#cErr').textContent = 'Dieser Code passt nicht. Bitte bei Trainer:in oder Zeugwart nachfragen.'; return; } LS.set('zugang:' + S.verein, true); S.sheet = null; wechsle('team'); },
  farbe(el) { S.form.farbe = el.dataset.c; el.parentElement.querySelectorAll('.swatch').forEach((c) => c.classList.toggle('on', c === el)); live(); ton('klick'); },
  vereine() { AKT.schliessen(true); S.sheet = 'vereine'; zeigeSheet(); },
  zu() { S.sheet = null; zeigeSheet(); },
  links() { GL.cur?.step(-1); }, rechts() { GL.cur?.step(1); },
  oeffnen(id) { S.sheet = null; zeigeSheet(); S.sel = id; S.form = {}; GL.cur?.takeDown?.(id); zeigeDetail(); },
  schliessen(still) { if (!S.sel) return; const id = S.sel; S.sel = null; S.form = {}; GL.cur?.refresh?.(id); GL.cur?.putBack?.(); zeigeDetail(); },
  vorne() { GL.cur?.face('vorne'); }, hinten() { GL.cur?.face('hinten'); },
  groesse(el) { S.form.groesse = el.dataset.g; el.parentElement.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === el)); ton('klick'); },
  inKorb() {
    const id = S.sel, a = ARTIKEL[id], sp = persAktiv(), f = S.form;
    const gr = groessenFuer(a); const groesse = gr.length ? (f.groesse || (sp.team ? groesseFuer(sp.team) : null)) : null;
    if (gr.length && !groesse) return toast('Bitte eine Größe wählen');
    const name = (f.name ?? sp.name ?? '').trim(), nummer = (f.nummer ?? sp.nummer ?? '').toString().trim();
    if (a.pers === 'nn' && !name) { $('#fName')?.focus(); return toast('Bitte einen Namen für den Rücken eintragen'); }
    const text = (f.text || '').trim();
    if (a.pers === 'gravur' && !text) { $('#fText')?.focus(); return toast('Bitte den Text eintragen'); }
    if (a.pers === 'frei' && !text && !f.motiv) { $('#fText')?.focus(); return toast('Bitte Text eintragen oder ein Motiv hochladen'); }
    const farbName = f.farbe ? (FARBEN.find((x) => x[0] === f.farbe) || [])[1] : null;
    const info = [groesse && `Größe ${groesse}`, a.pers === 'nn' && `${name.toUpperCase()} ${nummer}`.trim(), a.pers === 'fan' && `${(name || 'FAN').toUpperCase()} ${nummer || '12'}`, a.pers === 'name' && name, a.pers === 'opt' && f.fanNr && `Nr. ${f.fanNr}`,
      (a.pers === 'gravur' || a.pers === 'frei') && text && `„${text.replace(/\s*\|\s*/g, ' / ')}“`, a.pers === 'frei' && farbName, f.motivName && `Motiv: ${f.motivName}`].filter(Boolean).join(' · ');
    const key = [id, groesse, name, nummer, f.fanNr, text, f.farbe, f.motivName].join('|'); const vorh = S.cart.find((c) => c.key === key);
    if (vorh) vorh.menge++; else S.cart.push({ key, id, titel: a.titel, preis: a.preis, menge: 1, info });
    speichern(); ton('klick');
    S.sel = null; S.form = {}; zeigeDetail(); if (GL.cur?.toCart) GL.cur.toCart(); else GL.cur?.putBack?.(); setTimeout(() => GL.cur?.refresh?.(id), 650);
    kopf(); setTimeout(() => { const c = document.querySelector('.pill.cart'); c?.classList.add('bump'); setTimeout(() => c?.classList.remove('bump'), 650); }, 450); toast(`${a.titel} liegt im Warenkorb`);
  },
  plus(el) { S.cart[+el.dataset.i].menge++; speichern(); kopf(); zeigeSheet(); },
  minus(el) { const c = S.cart[+el.dataset.i]; c.menge--; if (c.menge <= 0) S.cart.splice(+el.dataset.i, 1); speichern(); kopf(); zeigeSheet(); },
  kasse() { S.sheet = 'kasse'; zeigeSheet(); },
  spielerOk() {
    const name = $('#sName').value.trim(), team = $('#sTeam').value, nummer = $('#sNr').value.replace(/\D/g, '');
    if (!name) { $('#sName').focus(); return toast('Bitte den Vornamen eintragen'); }
    S.spieler = { name, team, nummer }; speichern(); S.sheet = null; render(); GL.cur?.refreshAll?.(); toast(`Alles wird jetzt mit „${name.toUpperCase()}“ gezeigt`);
  },
  bestellen() {
    const kName = $('#kName').value.trim(), kMail = $('#kMail').value.trim(), kTel = $('#kTel').value.trim(), ueb = +(document.querySelector('input[name=ueb]:checked')?.value || 0);
    Object.assign(S.form, { kName, kMail, kTel, ueb });
    const err = !kName ? 'Bitte deinen Namen eintragen.' : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(kMail) ? 'Bitte eine gültige E-Mail-Adresse eintragen.' : '';
    if (err) { $('#kErr').textContent = err; return; }
    const nr = `${VC.zahlung.prefix}-${S.nr++}`; const sp = S.shop === 'team' ? S.spieler : null;
    const zweck = (sp ? [nr, sp.name, sp.team] : [nr, kName.split(' ').pop()]).filter(Boolean).join(' ');
    S.bestellung = { nr, summe: summe(), zweck, kontakt: kName, mail: kMail, tel: kTel, uebergabe: uebergabe()[ueb], shop: S.shop, items: S.cart.map((c) => ({ ...c })) };
    // Echtbetrieb: hier geht die Bestellung an /api/bestellung (Supabase) und an die Vereins-Mail
    S.cart = []; S.form = {}; speichern(); kopf(); S.sheet = 'danke'; zeigeSheet(); ton('klick');
  },
  kopieren(el) { const v = el.dataset.v; (navigator.clipboard?.writeText(v) || Promise.reject()).then(() => toast('Kopiert'), () => toast(v)); },
  verein(el) { location.search = `?verein=${el.dataset.k}&shop=${S.shop === 'werkstatt' ? 'fan' : S.shop}`; },
  neuVorschau() { const v = neuerVerein(); if (!v) return; VEREINE[v.key] = v.cfg; LS.set('zugang:' + v.key, true); S.sheet = null; vereinAus(v.key); setzeShop(S.shop === 'werkstatt' ? 'fan' : S.shop); render(); baueKabine(false); toast(`Vorschau: ${v.cfg.name}`); },
  neuKopieren() { const v = neuerVerein(); if (!v) return; const s = `'${v.key}': ${JSON.stringify(v.cfg, null, 2)},`; (navigator.clipboard?.writeText(s) || Promise.reject()).then(() => toast('Konfiguration kopiert'), () => { $('#nErr').textContent = s; }); },
};
function neuerVerein() {
  const g = (id) => ($('#' + id)?.value || '').trim(); const art = document.querySelector('input[name=nArt]:checked')?.value || 'verein';
  const name = g('nName'), kuerzel = (g('nKurz') || name.split(/\s+/).map((w) => w[0]).join('')).toUpperCase().slice(0, 4);
  S.neu = { name, beiname: g('nBei'), kuerzel, farbe: g('nF1'), farbe2: g('nF2'), logo: g('nLogo'), teams: g('nTeams'), art, empfaenger: g('nEmpf'), iban: g('nIban').replace(/\s+/g, '').toUpperCase(), bank: g('nBank'), fragen: g('nMail') };
  const e = !name ? 'Bitte den Vereinsnamen eintragen.' : art === 'verein' && !/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(S.neu.iban) ? 'Bitte eine gültige IBAN eintragen (oder Zahlung über OTB wählen).' : art === 'verein' && !S.neu.empfaenger ? 'Bitte den Kontoinhaber eintragen.' : '';
  if (e) { $('#nErr').textContent = e; return null; }
  const key = name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const cfg = { name, beiname: S.neu.beiname || 'Vereinsshop', kuerzel, wortmarke: name.split(/\s+/).pop().toUpperCase(), farbe: S.neu.farbe, farbe2: S.neu.farbe2, akzent: '#ffffff', logo: S.neu.logo, web: '', adresse: '',
    zahlung: art === 'verein' ? { art, empfaenger: S.neu.empfaenger, iban: S.neu.iban, bank: S.neu.bank, bic: '', fragen: S.neu.fragen, prefix: kuerzel } : { art, prefix: kuerzel, provision: 10 },
    teams: S.neu.teams.split(',').map((t) => t.trim()).filter(Boolean).map((t) => [t]), uebergabe: ['Beim Training der Mannschaft'], code: kuerzel + '2026',
    fan: ['fantrikot', 'fanshirt', 'fanhoodie', 'fanflasche'], team: ['heim', 'auswaerts', 'hoodie', 'beutel', 'flasche'] };
  return { key, cfg };
}

function wechsle(shop) {
  AKT.schliessen(true); setzeShop(shop); S.sheet = null; render(); baueKabine(true, true); ton('licht');
  try { if (!WERKSTATT_SEITE) { const u = new URL(location.href); u.searchParams.set('shop', S.shop); history.replaceState(null, '', u); } } catch (e) {}
  if (shop === 'team' && !S.spieler) setTimeout(() => toast('Tipp: Unten den Namen eintragen – dann hängt alles schon personalisiert da'), 3500);
}

// ===================== Start: Ladebildschirm, Eintreten =====================
function eintreten(mitTon) {
  S.ton = mitTon; tonStart(mitTon); tonAn(mitTon); if (mitTon) ton('summ');
  S.eingetreten = true; document.body.classList.add('drin'); kopf();
  if (S.wartetAufCode) { S.sheet = 'code'; zeigeSheet(); }
  else if (S.shop === 'team' && !S.spieler) setTimeout(() => toast('Tipp: Unten den Namen eintragen – dann hängt alles schon personalisiert da'), 4200);
}
function start() {
  const q = new URLSearchParams(location.search); vereinAus(q.get('verein') || 'fc-kapellerfeld');
  let shop = q.get('shop') || START_SHOP; if (shop === 'team' && !zugang()) { shop = 'fan'; S.wartetAufCode = true; }
  if (WERKSTATT_SEITE) shop = 'werkstatt', S.wartetAufCode = false; else if (shop === 'werkstatt') shop = START_SHOP;
  setzeShop(shop);
  if (WERKSTATT_SEITE) { document.body.classList.add('werkstatt-seite'); try { document.querySelector('meta[name=theme-color]').content = '#0a0807'; } catch (e) {} }
  document.title = WERKSTATT_SEITE ? 'OTB Werkstatt · Druck · Folie · Gravur (Demo)' : `${CLUB.name} · Shop (Demo)`;
  $('#loader .lname').textContent = VC.name; $('#loader .lcrest').innerHTML = logoHTML('lg');
  render(); glInit();
  const num = $('#loader .count'); let shown = 0; const t0 = performance.now();
  const tick = () => { const ziel = Math.min(100, ((performance.now() - t0) / 1600) * 100); shown = Math.max(shown, Math.floor(ziel)); num.textContent = String(shown).padStart(3, '0'); if (shown < 100) requestAnimationFrame(tick); else { $('#loader').classList.add('ready'); } };
  requestAnimationFrame(tick);
  setTimeout(() => baueKabine(true), 30);
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'oeffnen') return AKT.oeffnen(b.dataset.id);
    const f = AKT[b.dataset.a]; if (f) { e.preventDefault(); f(b); }
  });
  $('#enterSound').onclick = () => eintreten(true); $('#enterMute').onclick = () => eintreten(false);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.sheet) AKT.zu(); else AKT.schliessen(); } });
}
document.fonts?.ready?.then(() => GL.cur?.refreshAll?.());
start();

</script>
